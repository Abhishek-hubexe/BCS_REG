name = "bcs-registration-worker"
main = "src/index.js"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "bcs_registration_db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with real DB ID when deployed

[vars]
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA" # Dummy key for dev
ALLOWED_ORIGIN = "http://localhost:3000"
