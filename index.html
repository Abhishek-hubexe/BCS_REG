<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Spectrum | Multi-Club College Platform</title>
    <!-- Google Fonts: Inter & Newsreader for editorial aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              warm: {
                bg: '#FAF8F5',
                cream: '#F4EFEA',
                surface: '#FFFFFF',
                border: '#E7E0D8',
                borderHover: '#D4CBC0',
                charcoal: '#1C1917',
                gray: '#78716C',
                lightGray: '#A8A29E',
              },
              terracotta: {
                DEFAULT: '#C25E42',
                hover: '#A94E35',
                light: '#FAF0ED',
                muted: '#EAD8D2'
              },
              sage: {
                DEFAULT: '#5D7A68',
                light: '#EEF3F0',
                border: '#C8D9CE'
              },
              ochre: {
                DEFAULT: '#C28B38',
                light: '#FCF7ED',
                border: '#EED9B3'
              },
              brick: {
                DEFAULT: '#B84A39',
                light: '#FDF1EF',
                border: '#F0C9C2'
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
              display: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
            },
            boxShadow: {
              'subtle': '0 1px 3px rgba(28, 25, 23, 0.04), 0 1px 2px rgba(28, 25, 23, 0.02)',
              'card': '0 2px 8px -2px rgba(28, 25, 23, 0.05), 0 1px 4px -1px rgba(28, 25, 23, 0.03)',
              'elevated': '0 8px 24px -4px rgba(28, 25, 23, 0.08), 0 4px 12px -2px rgba(28, 25, 23, 0.04)',
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'reverse-spin': 'reverse-spin 6s linear infinite',
              'fade-in': 'fade-in 0.3s ease-out',
            },
            keyframes: {
              'reverse-spin': {
                '0%': { transform: 'rotate(360deg)' },
                '100%': { transform: 'rotate(0deg)' },
              },
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(4px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#1C1917] font-['Inter',sans-serif] antialiased selection:bg-[#FAF0ED] selection:text-[#C25E42] overflow-x-hidden min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
